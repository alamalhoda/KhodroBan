# CI برای frontend-vue (Vue.js): تست و build روی push/PR
name: Frontend Vue CI

on:
  push:
    branches: [main, develop]
    paths:
      - 'frontend-vue/**'
      - '.github/workflows/ci-frontend-vue.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'frontend-vue/**'
      - '.github/workflows/ci-frontend-vue.yml'

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend-vue
        run: npm ci

      # Force-install native binaries for Linux (npm optional deps bug: https://github.com/npm/cli/issues/4828)
      - name: Install native binaries (Rollup, LightningCSS, Tailwind Oxide)
        working-directory: ./frontend-vue
        run: |
          npm install @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --no-save

      - name: Run tests
        working-directory: ./frontend-vue
        env:
          # تست‌ها به backend وابسته نیستند (سرویس‌ها mock می‌شوند)
          VITE_BACKEND_TYPE: mock
        run: npm run test:run

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend-vue/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend-vue
        run: npm ci

      - name: Install native binaries (Rollup, LightningCSS, Tailwind Oxide)
        working-directory: ./frontend-vue
        run: |
          npm install @rollup/rollup-linux-x64-gnu lightningcss-linux-x64-gnu @tailwindcss/oxide-linux-x64-gnu --no-save

      - name: Build project
        working-directory: ./frontend-vue
        env:
          VITE_BACKEND_TYPE: django
        run: npm run build
