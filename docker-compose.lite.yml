services:
  backend:
    build:
      context: ./backend/django
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      - DB_ENGINE=sqlite
      - REDIS_HOST=redis
      - ALLOWED_HOSTS=localhost,127.0.0.1,backend,frontend
    depends_on:
      redis:
        condition: service_started
    volumes:
      - backend-database:/app/database
      - backend-media:/app/media
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  huey:
    build:
      context: ./backend/django
      dockerfile: Dockerfile
    command: python manage.py run_huey
    env_file: .env
    environment:
      - DB_ENGINE=sqlite
      - REDIS_HOST=redis
    volumes:
      - backend-database:/app/database
    depends_on:
      backend:
        condition: service_healthy
      redis:
        condition: service_started

  frontend:
    build:
      context: .
      dockerfile: frontend-vue/Dockerfile
      args:
        VITE_API_URL: /api
        VITE_BACKEND_TYPE: django
    ports:
      - "5174:80"
    depends_on:
      - backend

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 3

volumes:
  backend-database:
  backend-media:
